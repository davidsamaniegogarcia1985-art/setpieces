<style>
/* Layout: one-screen tablet app — fixed top bar, scrollable content, landscape-first board editor */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --hex:rgba(255,120,140,.045); --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overflow:hidden}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink)}

.top{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}

.ttl .i{width:30px;height:30px;border:2px solid var(--red-ink);border-radius:50%;display:grid;place-items:center;color:var(--red-ink);font-family:var(--display);font-weight:800;font-size:17px;flex:none}

.card>h3{margin:0;padding:12px 18px;background:var(--red);color:#fff;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;text-align:center}
.card .in{padding:16px;display:flex;flex-direction:column;gap:12px}
.empty{padding:28px;text-align:center;color:var(--muted);font-style:italic}
.muted{color:var(--muted)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:0 16px;border:1.5px solid var(--line)}
.search input{flex:1;border:0;background:none;min-height:52px;font-size:18px;outline:none}
/* Home */
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 16px 32px;
  background:radial-gradient(120% 80% at 50% -10%,#E0233F 0%,#A80E25 45%,#5C0613 100%)}
.homemain{overflow:auto}
.home{height:100%;min-height:0;justify-content:center;gap:14px!important;padding:16px 24px!important}

.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:14px}

.bmeta{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 14px}.bmeta .grow{flex:1;min-width:0}.bmeta .t{font-family:var(--display);font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bmeta .s{color:var(--muted);font-size:14px}
.catchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.catchips .chip{cursor:pointer;min-height:36px;padding:0 14px}.catchips .chip.on{background:var(--red,#C3102C);color:#fff}

.bulkp .nm{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bulkp small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}

.stylebar .txtb{font-family:var(--display);font-weight:800;font-size:15px;padding:0 10px;width:auto;min-width:44px;white-space:nowrap}.stylebar .numv{color:#fff;font-family:var(--display);font-weight:800;font-size:18px;align-self:center;min-width:22px;text-align:center}

.tool.anim-go{font-family:var(--display);font-weight:800;font-size:15px;gap:6px;display:flex;align-items:center;justify-content:center;background:var(--red,#C3102C);color:#fff}.tool.anim-go svg{width:18px;height:18px}
.homegrid .menu-btn{min-height:52px;display:flex;align-items:center;justify-content:center;gap:10px}

.livelist{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-right:1px solid var(--line)}
@media (max-width:860px){.livelist{max-height:36vh}main{overflow:auto!important}.livegrid{height:auto}.liveboard .stage{min-height:82vw}.editor .stage{min-height:70vw}}
.grp{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:8px 4px 0}
.lp{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;box-shadow:var(--shadow);width:100%}
.lp.on{outline:3px solid var(--red)}
.lp .t{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.05;text-transform:uppercase;flex:1;min-width:0}
.lp .cnt{font-family:var(--display);font-weight:800;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.liveboard{display:flex;flex-direction:column;min-height:0;min-width:0}
.liveboard .stage{flex:1}
.results{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
.results button{padding:10px 16px;border-radius:999px;border:2px solid var(--line);font-family:var(--display);font-weight:700;font-size:17px;background:var(--surface-2)}
.results button.goal{border-color:var(--ok);color:var(--ok)}
.results .lbl{width:100%;text-align:center;font-family:var(--display);font-weight:700;letter-spacing:.08em;color:var(--muted);font-size:14px}
.brief{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.bcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;text-align:left;display:flex;flex-direction:column;width:100%}
.bcard .mini{background:#2B7A34;aspect-ratio:74/61;padding:4px}
.bcard .bi{padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.bcard .bt{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;line-height:1.05}
.bcard .role{background:var(--red-soft);color:var(--red-ink);border-radius:10px;padding:6px 10px;font-weight:600;font-size:15px}
.subrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow)}
.subrow .arrow{font-family:var(--display);font-weight:800;font-size:18px}
.out{color:#C0392B}.inn{color:var(--ok)}
table.stat{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
table.stat th,table.stat td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.stat th{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-size:15px;background:var(--surface-2)}
table.stat td.num,table.stat th.num{text-align:right}
.tablewrap{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--red)}
.crestpick{border:2px dashed var(--red);border-radius:16px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--red-ink);font-weight:700;background:var(--surface-2);width:100%}
.crestpick img,.crestpick svg{width:84px;height:84px;object-fit:contain}
.colors{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.colors input[type=color]{width:54px;height:44px;border:0;border-radius:10px;padding:0;background:none}
.hl-pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.hl-pulse{animation:none}}
.tokpanel{position:absolute;left:8px;top:8px;bottom:8px;width:250px;overflow:auto;background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
[hidden]{display:none!important}
.tokpanel>*{flex-shrink:0}
.side .tokpanel{position:static;inset:auto;width:auto;flex:1;min-height:0;border-radius:0;box-shadow:none;margin:0;border-left:0}
.side:has(#tokpanel:not([hidden])) .sw2,.side:has(#tokpanel:not([hidden])) h4,.side:has(#tokpanel:not([hidden])) .plist,.side:has(#tokpanel:not([hidden])) .bulkbtn{display:none}
@media (min-width:901px){.editor{grid-template-columns:128px minmax(0,1fr) 260px}.editor.noside{grid-template-columns:128px minmax(0,1fr)}}
@media (max-width:900px){.side .tokpanel{width:auto}}
.tokpanel label{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tokpanel .inp{min-height:40px;font-size:15px;padding:6px 10px;border-radius:10px}
.tokpanel .btn{width:100%;margin-top:4px}
.tp-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:18px;text-transform:uppercase}
.tp-h button{width:32px;height:32px;border-radius:50%;background:var(--red-soft);color:var(--red-ink)}
.tp-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tp-b{flex:1;min-width:40px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink)}
.tp-b.on{background:var(--red);border-color:var(--red);color:#fff}
.tp-row.step span{min-width:56px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.tp-row input[type=color]{width:46px;height:38px;border:0;padding:0;background:none}
.tp-row input[type=color]:disabled{opacity:.3}
.sw-row{display:flex;gap:4px;flex-wrap:wrap}
.sw-row .sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
@media (max-width:900px){.tokpanel{width:210px}}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.fopt{display:flex;flex-direction:column;gap:6px;align-items:center;padding:8px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink)}
.fopt.on{border-color:var(--red);color:var(--red-ink);background:var(--red-soft)}
.fthumb{width:100%;aspect-ratio:4/3;display:block;background:#2B7A34;border-radius:8px;overflow:hidden}
.fthumb svg{width:100%;height:100%;display:block}
.row.dragging{outline:3px solid var(--red);box-shadow:0 12px 30px rgba(80,10,20,.25);position:relative;z-index:5}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:55;display:flex;flex-direction:column}
.chk{display:flex;align-items:center;gap:10px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--red)}
</style>
</head>

  const t=db.teams.find(x=>/HAPOEL/i.test(x.name))||db.teams[0];
  if(t){t.players.forEach(p=>{if(p.alias&&p.alias.trim().toUpperCase()===p.name.trim().toUpperCase())p.alias=''});
   ROSTER.forEach(([n,num,pos])=>{const ex=t.players.find(p=>p.name.toUpperCase()===n);if(ex){if(ex.number==null||ex.number==='')ex.number=num}else t.players.push({id:uid(),name:n,alias:'',number:num,pos,archived:false})})}
  const fix=pl=>{if(pl.view==='half'||!pl.view)pl.view='top';if(pl.view==='full')pl.view='vfull';if(pl.view==='hhalf')pl.view='hwide';if(pl.op==null)pl.op=100};
  db.plans.forEach(p=>p.plays.forEach(fix));(db.favs||[]).forEach(fix);db.m2=true}
 if(!db.m3){db.profile=db.profile||{};if(!db.profile.name||db.profile.name==='David')db.profile.name='David Samaniego';if(!db.profile.role||db.profile.role==='Entrenador de balón parado')db.profile.role='2º Entrenador';db.m3=true}
 if(!db.boards)db.boards=[];
 return db}

  const mk=o=>new Board(document.createElement('div'),play,Object.assign({mode:'view',teamObj:ctx.team,opp:ctx.opp,names:!!R.names,fitAll:true},o));
  const vw=VIEWS[play.view]||VIEWS.top,vb=mk({}).svg.getAttribute('viewBox').split(' ').map(Number);let W=1280,H=Math.round(W*vb[3]/vb[2]);if(H>1280){H=1280;W=Math.round(H*vb[2]/vb[3])}W-=W%2;H-=H%2;const sc=W/vb[2];

  const bgB=mk({noTokens:true});bgB.hideDrw=true;bgB.draw();
  const bg=await svgToCanvas(bgB.svg,W,H),f0=await svgToCanvas(mk({}).svg,W,H);
  const tb=mk({}),toks=[],order={ball:9,cone:0};
  for(const t of [...play.tokens].sort((a,c)=>(order[a.type]??5)-(order[c.type]??5))){tb.pats={};const inner=tb.tokInner(t);const S=7,px=Math.round(2*S*sc);
   toks.push({t,img:await loadImg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-S} ${-S} ${2*S} ${2*S}" width="${px}" height="${px}"><defs>${Object.values(tb.pats).join('')}</defs>${inner}</svg>`),px})}
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;cv.style.cssText='width:100%;border-radius:12px;display:block';b.box.appendChild(cv);const g=cv.getContext('2d');g.drawImage(f0,0,0);
  const stream=cv.captureStream(30),rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6000000}),chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const done=new Promise(r=>rec.onstop=r);rec.start(200);
  const n=play.frames.length,hold=1100,seg=1150/speed,tail=1000,total=hold+(n-1)*seg+tail;
  const toScreen=p=>{const q=vw.r?{x:105-p.y,y:p.x}:p;return {x:(q.x-vb[0])*sc,y:(q.y-vb[1])*sc}};
  await new Promise(res=>{let t0=null;const step=ts=>{if(t0===null)t0=ts;const el=ts-t0;
   if(el<hold){g.drawImage(f0,0,0)}else{const k=Math.min(n-1,(el-hold)/seg),i=Math.floor(k),f=easeIO(k-i),j=Math.min(i+1,n-1);g.drawImage(bg,0,0);
    for(const o of toks){const a=tb.pos(o.t.id,i),c=tb.pos(o.t.id,j),s=toScreen({x:a.x+(c.x-a.x)*f,y:a.y+(c.y-a.y)*f});g.drawImage(o.img,s.x-o.px/2,s.y-o.px/2,o.px,o.px)}}
   b.set(`Grabando… ${Math.min(100,Math.round(el/total*100))}%`);
   if(el>=total){res();return}requestAnimationFrame(step)};requestAnimationFrame(step)});
  rec.stop();await done;const ext=mime.includes('mp4')?'mp4':'webm';const blob=new Blob(chunks,{type:mime.split(';')[0]});closeModal();
  if(ext!=='mp4')toast('Este navegador solo graba WebM: el vídeo se guarda en ese formato');

 <div class="bgrid">${list.map(b=>`<div class="bcard"><button class="bthumb" data-a="boardOpen" data-id="${b.id}" aria-label="Abrir ${esc(b.name)}"><span data-bthumb="${b.id}"></span></button><div class="bmeta"><button class="grow" data-a="boardOpen" data-id="${b.id}" style="text-align:left"><div class="t">${esc(b.name)}</div><div class="s">${esc([b.task&&b.task.cat,b.task&&b.task.dur?b.task.dur+(/\d$/.test(b.task.dur)?' min':''):'',b.frames.length>1?b.frames.length+' fotogramas':''].filter(Boolean).join(' · ')||'Sin categoría')}</div></button><button class="rowdel" data-a="boardDupRow" data-id="${b.id}" title="Duplicar" aria-label="Duplicar ${esc(b.name)}">${IC.dup}</button><button class="rowdel" data-a="boardDelRow" data-id="${b.id}" title="Borrar" aria-label="Borrar ${esc(b.name)}">${IC.trash}</button></div></div>`).join('')||`<div class="empty">${DB.boards.length?'No hay tareas con ese filtro.':'Crea tu primera pizarra: tareas de entrenamiento, ejercicios o jugadas con material, petos y animación.'}</div>`}</div></div></main>`};
function playRow(p,ctx){const a=action(p.actionId);return `<div class="row" data-id="${p.id}"><span class="handle">${IC.handle}</span><button class="grow" data-a="openPlay" data-id="${p.id}" data-ctx="${ctx}" style="text-align:left"><div class="t">${esc(p.name)}</div><div class="s">${esc(a?a.name:'Sin acción')}${p.frames.length>1?` · ${p.frames.length} fotogramas`:''}</div></button><span class="chip${p.side==='def'?' def':''}">${p.side==='def'?'Def.':'Of.'}</span><button class="rowdel" data-a="playRowDel" data-id="${p.id}" data-ctx="${ctx}" title="Borrar jugada" aria-label="Borrar jugada ${esc(p.name)}">${IC.trash}</button></div>`}

V.plans=()=>{const q=(R.q||'').toLowerCase();const list=[...DB.plans].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).filter(p=>!q||(p.opp.name+' '+team(p.teamId)?.name+' '+comp(p.compId)?.name).toLowerCase().includes(q));
 return `${header('Plan de partido',{help:'plans'})}<main><div class="pad"><div class="actions"><button class="btn" data-a="planNew">Nuevo plan de partido</button></div>
 <label class="search"><input id="planQ" placeholder="BUSCAR" value="${esc(R.q||'')}" data-f="planQ" aria-label="Buscar"><span class="muted">▸</span></label>
 <div class="list">${list.map(p=>{const t=team(p.teamId),us=`<b>${esc(t?.name||'')}</b>`,them=`<span>${esc(p.opp.name)}</span>`;return `<button class="row" data-a="nav" data-v="plan" data-id="${p.id}"><span class="grow"><span class="t" style="display:block;text-transform:none">${p.home?us+' <span class="muted" style="font-size:18px">vs</span> '+them:them+' <span class="muted" style="font-size:18px">vs</span> '+us}</span><span class="s" style="display:block;text-transform:none">${fmtDate(p.date)} · ${p.home?'Local':'Visitante'} · ${esc(comp(p.compId)?.name||'')} · ${p.plays.length} jugadas</span></span><span class="chev">›</span></button>`}).join('')||'<div class="empty">No hay planes que coincidan.</div>'}</div></div></main>`};

V.plan=()=>{const p=plan(R.id);if(!p)return V.plans();const tab=R.tab||'datos';let body='',foot='';
 if(tab==='datos'){const c=comp(p.compId);
  body=`<div class="pad"><div class="form">
  <label class="field c6"><span>Equipo</span><select class="inp" data-f="plan.teamId">${DB.teams.map(t=>`<option value="${t.id}"${t.id===p.teamId?' selected':''}>${esc(t.name)}</option>`).join('')}</select></label>
  <div class="field c6"><span>Equipo contrario</span><div style="display:flex;gap:10px"><input class="inp" data-f="plan.opp.name" value="${esc(p.opp.name)}"><button class="iconbtn" style="width:54px;height:54px;border-radius:14px;flex:none" data-a="oppCrest" aria-label="Escudo del rival">${p.opp.crest?`<img src="${p.opp.crest}" style="width:40px;height:40px;object-fit:contain" alt="">`:crestSVG(initials(p.opp.name),'#7A8794').replace('<svg','<svg width="40" height="40"')}</button></div></div>
  <label class="field c3"><span>Fecha</span><input type="date" class="inp" data-f="plan.date" value="${esc(p.date)}"></label>
  <label class="field c3"><span>Hora</span><input type="time" class="inp" data-f="plan.time" value="${esc(p.time)}"></label>
  <div class="field c6"><span>Condición</span><div class="seg"><button class="${p.home?'on':''}" data-a="planHome" data-k="1">Local</button><button class="${!p.home?'on':''}" data-a="planHome" data-k="0">Visitante</button></div></div>
  <div class="field c6"><span>Colores del rival en la pizarra</span><div class="colors"><label class="chk">Jugador <input type="color" data-f="plan.opp.color" value="${p.opp.color}"></label><label class="chk">Portero <input type="color" data-f="plan.opp.gk" value="${p.opp.gk}"></label></div></div>
  <div class="card c12"><div class="in"><div class="form" style="align-items:end"><label class="field c4"><span>Competición</span><select class="inp" data-f="plan.compId">${DB.comps.map(x=>`<option value="${x.id}"${x.id===p.compId?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="c2" style="grid-column:span 2;display:flex;gap:8px"><button class="btn sm" data-a="compEdit" data-id="${p.compId}" aria-label="Editar competición">${IC.edit}</button><button class="btn sm" data-a="compEdit" aria-label="Nueva competición">+</button></div>
  ${c?`<div class="c6 kpis" style="grid-column:span 6">${[[c.starters,'Titulares'],[c.subs,'Suplentes'],[c.changes,'Cambios'],[c.windows,'Ventanas'],[c.half+'’','Duración de cada parte']].map(([n,l])=>`<div class="kpi" style="box-shadow:none;background:var(--surface-2)"><b style="font-size:30px">${n}</b><span>${l}</span></div>`).join('')}<div class="kpi" style="box-shadow:none;background:var(--surface-2)"><b style="font-size:20px">${c.extra?'Con prórroga':'Sin prórroga'}</b></div></div>`:''}</div></div></div>
  </div></div>`;
  foot=`<div class="footer"><button class="btn ghost" data-a="liveGo" data-id="${p.id}">${IC.play} Jugar este partido</button><button class="btn" data-a="pdfPlan">${IC.download} PDF de todas las jugadas (${p.plays.length})</button><button class="btn" data-a="planDup">Duplicar</button><button class="btn dark" data-a="planDel">Borrar</button></div>`}
 else if(tab==='jug'){const t=team(p.teamId),c=comp(p.compId)||{starters:11,subs:9};const sub=R.sub||'pitch';
  if(sub==='starters'||sub==='subs'){const isS=sub==='starters',max=isS?c.starters:c.subs,sel=isS?p.starters:p.subs,other=isS?p.subs:p.starters;
   const pl=t.players.filter(x=>!x.archived).sort((a,b)=>(POS_ORDER[a.pos]-POS_ORDER[b.pos])||((a.number??999)-(b.number??999)));
   body=`<div class="pad"><div class="counter"><span>${isS?'TITULARES':'SUPLENTES'} (MÁX. ${max})</span><span>${sel.length} / ${max}</span></div><div class="selgrid">${pl.map(x=>{const on=sel.includes(x.id),dis=!on&&(sel.length>=max||other.includes(x.id));return `<button class="selrow${on?' on':''}" data-a="toggleSel" data-k="${sub}" data-id="${x.id}"${dis?' disabled':''}>${shirtSVG(pnum(x),x.pos==='POR'?t.gk:t.c1,x.pos==='POR'?t.gk:t.c2,x.pos==='POR'?'solid':t.pattern)}<span><span class="t" style="display:block;font-family:var(--display);font-weight:700;font-size:21px">${esc(x.name)}</span><span class="muted">${x.pos}${other.includes(x.id)?(isS?' · suplente':' · titular'):''}</span></span><span class="dot">${on?'✓':''}</span></button>`}).join('')}</div></div>`;
   foot=`<div class="footer"><button class="btn" data-a="planSub" data-k="pitch">Guardar</button></div>`}
  else if(sub==='marks'){body=`<div class="pad"><p class="muted" style="margin:0">Marcas para las acciones defensivas: a quién marca o qué zona cubre cada titular.</p><div class="grid2">${p.starters.map(id=>{const x=playerById(id);return x?`<div class="row" style="min-height:0"><span class="badge${x.pos==='POR'?' por':''}">${esc(pnum(x))}</span><div class="grow"><div class="t" style="font-size:20px">${esc(pname(x))}</div><input class="inp" style="min-height:44px;font-size:17px;margin-top:6px" placeholder="Ej. marca al 9 · zona 1er palo" data-f="mark" data-id="${id}" value="${esc(p.marks[id]||'')}"></div></div>`:''}).join('')||'<div class="empty">Elige primero los titulares.</div>'}</div></div>`;
   foot=`<div class="footer"><button class="btn" data-a="planSub" data-k="pitch">Hecho</button></div>`}
  else{body=`<div class="pad"><div class="seg" style="flex-wrap:wrap"><button class="on" data-a="planSub" data-k="starters">Titulares (${p.starters.length}/${c.starters}) ›</button><button class="on" data-a="planSub" data-k="subs">Suplentes (${p.subs.length}/${c.subs}) ›</button><button class="${p.starters.length?'on':''}" data-a="planSub" data-k="marks"${p.starters.length?'':' disabled'}>Marcas ›</button></div>
   <div class="lineup"><div><div class="pitchbox" id="lineupPitch"></div><p class="muted" style="margin:6px 4px 0;font-size:14px">Arrastra a los titulares para colocar la alineación.</p></div><div class="card"><h3>Suplentes · ${p.subs.length}/${c.subs}</h3><div class="in">${p.subs.map(id=>{const x=playerById(id);return x?`<div style="display:flex;align-items:center;gap:12px"><span class="badge${x.pos==='POR'?' por':''}" style="width:42px;height:42px;font-size:21px">${esc(pnum(x))}</span><b style="font-family:var(--display);font-size:20px">${esc(pname(x))}</b><span class="muted">${x.pos}</span></div>`:''}).join('')||'<div class="empty">Sin suplentes</div>'}</div></div></div></div>`}
 }
 else{const f=R.f||'all';const list=p.plays.filter(x=>f==='all'||x.side===f);
  body=`<div class="pad"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg" style="width:min(100%,360px)"><button class="${f==='all'?'on':''}" data-a="playFilter" data-k="all">Todas</button><button class="${f==='of'?'on':''}" data-a="playFilter" data-k="of">Ofensivas</button><button class="${f==='def'?'on':''}" data-a="playFilter" data-k="def">Defensivas</button></div><span style="flex:1"></span><button class="btn" data-a="playNew">Nueva jugada</button></div>
  <div class="list" data-sort="plays">${list.map(x=>playRow(x,'plan')).join('')||'<div class="empty">Sin jugadas. Crea una nueva o impórtala de tus favoritas.</div>'}</div></div>`}
 return `${header('Editar plan de partido',{help:'plan',sub:matchup(p)})}${tabs([['datos','Datos'],['jug','Jugadores'],['jugadas','Jugadas']],tab,'planTab')}<main>${body}</main>${foot}`};

/* --- play editor --- */
function playCtx(){if(R.ctx==='board'){const p=DB.boards.find(x=>x.id===R.id);return {play:p,plan:null,team:p?boardTeam(p):DB.teams[0],opp:p?boardKit(p).b:null,list:DB.boards,title:'Pizarra táctica'}}if(R.ctx==='fav'){const p=DB.favs.find(x=>x.id===R.id);return {play:p,plan:null,team:DB.teams[0],list:DB.favs}}const pl=plan(R.pid);const p=pl?.plays.find(x=>x.id===R.id);return {play:p,plan:pl,team:team(pl?.teamId),list:pl?.plays}}
V.play=()=>{const {play:p,plan:pl,team:t}=playCtx();if(!p){back();return ''}const tab=R.tab||'pizarra';let body='',foot='';
 if(tab==='datos'&&R.ctx==='board'){const k=p.task=p.task||{};const F=(key,l,ph,cls='c6',ta=false)=>`<label class="field ${cls}"><span>${l}</span>${ta?`<textarea class="inp" data-f="task.${key}" placeholder="${ph}">${esc(k[key]||'')}</textarea>`:`<input class="inp" data-f="task.${key}" value="${esc(k[key]||'')}" placeholder="${ph}">`}</label>`;
  body=`<div class="pad"><div class="form">
  <label class="field c12"><span>Nombre de la tarea</span><input class="inp" data-f="play.name" value="${esc(p.name)}"></label>
  <label class="field c6"><span>Categoría</span><input class="inp" data-f="task.cat" list="taskCats" value="${esc(k.cat||'')}" placeholder="Ej. Rondo"><datalist id="taskCats">${TASK_CATS.map(c=>`<option value="${c}">`).join('')}</datalist></label>
  ${F('obj','Objetivo','Ej. mejorar la salida de balón ante presión alta')}${F('dur','Duración (min)','Ej. 12','c3')}${F('series','Series / repeticiones','Ej. 3 x 4 min','c3')}${F('players','Jugadores','Ej. 8 + 2 comodines')}${F('space','Espacio','Ej. 30 x 20 m')}
  ${F('desc','Descripción','Explica cómo se desarrolla la tarea','c12',true)}${F('var','Variantes','Ej. limitar a 2 toques; añadir un defensor','c6',true)}${F('keys','Puntos clave / consignas','Ej. perfilarse antes de recibir','c6',true)}
  <div class="field c6"><span>Campo / espacio</span><button class="btn ghost" data-a="fieldDlg">${IC.field} ${esc((VIEWS[p.view]||VIEWS.top).l)} · ${p.op??100}%</button></div>
  <div class="field c6"><span>Colores de los equipos</span><button class="btn ghost" data-a="kitDlg">${IC.kit} Cambiar colores</button></div>
  </div></div>`;
  foot=`<div class="footer"><button class="btn" data-a="playDup">Duplicar</button><button class="btn" data-a="playShare">${IC.img} Imagen</button><button class="btn" data-a="pdfPlay">${IC.download} Crear PDF</button><button class="btn dark" data-a="playDel">Borrar</button></div>`}
 else if(tab==='datos'){const a=action(p.actionId);const prms=(a?.params||[]).map(id=>DB.params.find(x=>x.id===id)).filter(Boolean);
  body=`<div class="pad"><div class="form">
  <label class="field c12"><span>Nombre de la jugada</span><input class="inp" data-f="play.name" value="${esc(p.name)}"></label>
  <label class="field c6"><span>Acción</span><select class="inp" data-f="play.actionId"><option value="">— Sin acción —</option>${DB.actions.map(x=>`<option value="${x.id}"${x.id===p.actionId?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
  <div class="field c6"><span>Sentido</span><div class="seg"><button class="${p.side==='of'?'on':''}" data-a="playSide" data-k="of">Ofensivo</button><button class="${p.side==='def'?'on':''}" data-a="playSide" data-k="def">Defensivo</button></div></div>
  ${prms.map(x=>`<label class="field c6"><span>${esc(x.name)}</span><select class="inp" data-f="play.param" data-id="${x.id}"><option value="">—</option>${x.options.map(o=>`<option${p.params[x.id]===o?' selected':''}>${esc(o)}</option>`).join('')}</select></label>`).join('')}
  <label class="field c12"><span>Señal (opcional)</span><input class="inp" data-f="play.signal" value="${esc(p.signal)}" placeholder="Ej. el portero levanta la mano derecha"></label>
  <label class="field c12"><span>Notas / claves para los jugadores</span><textarea class="inp" data-f="play.notes" placeholder="Ej. bloqueo al portero, atacar 1er palo con carrera desde fuera del área">${esc(p.notes)}</textarea></label>
  <div class="field c6"><span>Campo en la pizarra</span><button class="btn ghost" data-a="fieldDlg">${IC.field} ${esc((VIEWS[p.view]||VIEWS.top).l)} · ${p.op??100}%</button></div>
  </div></div>`;
  foot=`<div class="footer"><button class="btn" data-a="playDup">Duplicar</button>${R.ctx!=='fav'&&R.ctx!=='board'?`<button class="btn ghost" data-a="playFav">${IC.star} Guardar en favoritas</button>`:''}<button class="btn" data-a="playShare">Imagen</button><button class="btn" data-a="pdfPlay">${IC.download} Crear PDF</button><button class="btn dark" data-a="playDel">Borrar</button></div>`}
 else{const anim=tab==='anim';
  const tools=anim?'':`<div class="tools" role="toolbar" aria-label="Herramientas">
   <button class="tool" data-a="tool" data-k="move" title="Mover / seleccionar">${IC.move}</button><button class="tool" data-a="fieldDlg" title="Campo y espacios">${IC.field}</button>
   <button class="tool" data-a="tool" data-k="lasso" title="Seleccionar varios (toca o arrastra un recuadro) y moverlos juntos">${IC.lasso}</button>${R.ctx==='board'?`<button class="tool" data-a="kitDlg" title="Colores de los equipos">${IC.kit}</button>`:'<span></span>'}<hr>
   <button class="tool" data-a="tool" data-k="wave" title="Conducción">${IC.wave}</button><button class="tool" data-a="tool" data-k="line" title="Línea">${IC.line}</button>
   <button class="tool" data-a="tool" data-k="curve" title="Curva">${IC.curve}</button><button class="tool" data-a="tool" data-k="circle" title="Círculo">${IC.circle}</button>
   <button class="tool" data-a="tool" data-k="ellipse" title="Elipse">${IC.ellipse}</button><button class="tool" data-a="tool" data-k="rect" title="Zona">${IC.rect}</button>
   <button class="tool" data-a="tool" data-k="text" title="Texto">${IC.text}</button><button class="tool" data-a="tool" data-k="alert" title="Alerta">${IC.alert}</button><hr>
   <button class="tool" data-a="tokMenu" data-k="tok" title="Jugadores">${IC.shirt}</button><button class="tool" data-a="tool" data-k="ball" title="Balón">${IC.ball}</button>
   <button class="tool" data-a="tool" data-k="cone" title="Cono">${IC.cone}</button><button class="tool" data-a="toggleNames" title="Mostrar u ocultar los nombres de mi equipo">${IC.names}</button>
   <button class="tool" data-a="equipMenu" data-k="equip" title="Material: conos, picas, maniquís, porterías…">${IC.equip}</button><button class="tool" data-a="bibMenu" title="Poner peto a los jugadores seleccionados">${IC.bib}</button><button class="tool" data-a="bulkDlg" title="Volcar varios jugadores a la vez">${IC.squad}</button><hr>
   <button class="tool sigt" data-a="sigTool" data-v="one" title="Señal: un brazo arriba">${sigIcon('one')}</button><button class="tool sigt" data-a="sigTool" data-v="two" title="Señal: dos brazos arriba">${sigIcon('two')}</button>
   <button class="tool sigt" data-a="sigTool" data-v="cross" title="Señal: brazos cruzados arriba">${sigIcon('cross')}</button><span></span><hr>
   <button class="tool" data-a="tplDlg" title="Plantillas de colocación">${IC.template}</button><button class="tool" data-a="copyPosDlg" title="Copiar posiciones de otra jugada">${IC.copyPos}</button>
   <button class="tool${snapOn()?' on':''}" data-a="toggleSnap" title="Imán y guías de alineación">${IC.magnet}</button><span></span><hr>
   <button class="tool" data-a="scaleAll" data-d="-1" title="Hacer todo más pequeño">${IC.minusAll}</button><button class="tool" data-a="scaleAll" data-d="1" title="Hacer todo más grande">${IC.plusAll}</button>
   <span class="scalelbl" id="scaleLbl">${Math.round((p.scale||1)*100)}%</span><span></span>
   <button class="tool" data-a="layer" data-d="1" title="Traer al frente (elemento seleccionado)">${IC.toFront}</button><button class="tool" data-a="layer" data-d="-1" title="Enviar al fondo (elemento seleccionado)">${IC.toBack}</button><hr>
   <button class="tool" data-a="undo" title="Deshacer">${IC.undo}</button><button class="tool" data-a="dupSel" title="Duplicar">${IC.dup}</button>
   <button class="tool wide" data-a="delSel" title="Borrar seleccionado">${IC.trash}</button>${R.ctx==='board'?`<hr><button class="tool" data-a="playShare" title="Crear imagen">${IC.img}</button><button class="tool" data-a="pdfPlay" title="Crear PDF">${IC.pdf}</button><button class="tool wide anim-go" data-a="playTab" data-k="anim" title="Ir a la animación">${IC.play} Animación</button>`:''}</div>`;
  const sideK=R.side||(pl?'st':'all');const roster=sideK==='st'?[...(pl?.starters||[]),...(pl?.subs||[])]:t.players.filter(x=>!x.archived).map(x=>x.id);
  const used=new Set(p.tokens.map(x=>x.pid).filter(Boolean));
  const side=anim?'':`<aside class="side"><div class="tokpanel" id="tokpanel" hidden></div>${pl?`<div class="sw2"><button class="${sideK==='st'?'on':''}" data-a="sideTab" data-k="st">Convocados</button><button class="${sideK==='all'?'on':''}" data-a="sideTab" data-k="all">Plantilla</button></div>`:''}<h4>${sideK==='st'?`CONVOCADOS (${roster.length})`:'PLANTILLA'}</h4><button class="bulkbtn" data-a="bulkDlg" title="Marca varios jugadores y ponlos todos de golpe en la pizarra">${IC.plus} Volcar varios</button><div class="plist">${roster.map(id=>{const x=playerById(id);return x?`<button class="pbtn${used.has(id)?' used':''}${BOARD&&BOARD.placePid===id?' on':''}" data-a="placePlayer" data-id="${id}"><span class="n">${esc(pnum(x))}</span><span class="nm">${esc(pname(x))}<small>${x.pos}${pl&&pl.subs.includes(id)?' · suplente':''}${used.has(id)?' · en pizarra':''}</small></span></button>`:''}).join('')||'<div class="empty" style="color:#fff">'+(R.ctx==='fav'?'Usa la pestaña Plantilla.':'Sin titulares. Vuelve a la pestaña Jugadores del plan para añadirlos.')+'</div>'}</div></aside>`;
  const n=p.frames.length,f=R.frame||0;
  const animbar=anim?`<div class="animbar"><div class="frames">${Array.from({length:12},(_,i)=>`<button class="fr${i===f?' on':''}" data-a="frame" data-k="${i}"${i>=n?' disabled':''}>${i+1}</button>`).join('')}</div><div class="ctrls">

const RES_OF=[['Gol','goal'],['Remate a puerta'],['Remate fuera'],['Remate bloqueado'],['2ª jugada'],['Despejada'],['Falta a favor'],['Fuera de juego'],['Pérdida']];

const SHOTS=['Gol','Remate a puerta','Remate fuera','Remate bloqueado'];
function liveState(p){if(!p.live)p.live={running:false,startedAt:0,elapsed:0,half:1,us:0,them:0,subs:[],log:[],phase:'pre'};const L=p.live;if(!L.phase)L.phase=(L.elapsed>0||L.running)?(L.half===2?'2T':'1T'):'pre';return L}
function liveElapsed(L){return L.elapsed+(L.running?Date.now()-L.startedAt:0)}
function liveMinute(p){const L=liveState(p),c=comp(p.compId)||{half:45};return (L.half===2?c.half:0)+Math.floor(liveElapsed(L)/60000)+1}
function liveClockMs(p){const L=liveState(p),c=comp(p.compId)||{half:45};return liveElapsed(L)+(L.half===2?c.half*60000:0)}
function resolver(p){const m={};(p.live?.subs||[]).forEach(s=>{m[s.out]=s.in});return id=>{let x=id,g=0;while(m[x]&&g++<30)x=m[x];return x}}
function onField(p){const res=resolver(p);return p.starters.map(res)}
function subsIn(p){return new Set((p.live?.subs||[]).map(s=>s.in))}
function fmtClock(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function liveOrdered(p,f){const groups={};p.plays.filter(x=>x.side===f).forEach(x=>{const k=x.actionId||'_';(groups[k]=groups[k]||[]).push(x)});return {groups,list:Object.values(groups).flat()}}
function playerPlays(p,pid){const res=resolver(p);return p.plays.filter(pl=>pl.tokens.some(tk=>tk.pid&&res(tk.pid)===pid))}
const PHASE={pre:'SIN EMPEZAR','1T':'1ª PARTE',HT:'DESCANSO','2T':'2ª PARTE',FT:'FINAL'};
function subStrip(p){const L=liveState(p);if(!L.subs.length)return '';return `<div class="substrip"><span class="lbl">CAMBIOS</span>${L.subs.map(s=>{const o=playerById(s.out),i=playerById(s.in);return `<button class="chip2" data-a="subChip" data-id="${s.in}" title="Ver sus jugadas"><span class="m">${s.min}'</span><span class="inn">▲ ${esc(pnum(i))} ${esc(pname(i))}</span><span class="out">▼ ${esc(pnum(o))} ${esc(pname(o))}</span></button>`}).join('')}</div>`}
function scoreBlock(k,n){return `<div class="sb-score"><span class="n">${n}</span><span class="pm"><button data-a="score" data-k="${k}" data-d="-1" aria-label="Quitar gol">−</button><button data-a="score" data-k="${k}" data-d="1" aria-label="Sumar gol">+</button></span></div>`}
function liveBar(p){const L=liveState(p),t=team(p.teamId);
 const us=`<div class="sb-team">${crestOf(t)}<span>${esc(t?.name||'')}</span></div>`,them=`<div class="sb-team">${oppCrest(p.opp)}<span>${esc(p.opp.name)}</span></div>`;
 const left=p.home?[us,scoreBlock('us',L.us),scoreBlock('them',L.them),them]:[them,scoreBlock('them',L.them),scoreBlock('us',L.us),us];
 let ctl='';
 if(L.phase==='pre')ctl=`<button class="btn sm" data-a="clockStart">${IC.play} Iniciar 1T</button>`;
 else if(L.phase==='1T'||L.phase==='2T')ctl=`<button class="btn sm${L.running?' ghost':''}" data-a="clockToggle">${L.running?IC.pause+' Pausa':IC.play+' Reanudar'}</button><button class="btn sm dark" data-a="endHalf">Finalizar ${L.phase}</button>`;
 else if(L.phase==='HT')ctl=`<button class="btn sm" data-a="clockStart">${IC.play} Iniciar 2T</button>`;
 else ctl=`<button class="btn sm ghost" data-a="reopen">Reabrir</button>`;
 return `<div class="livebar"><div class="lb-left"><span class="livedot${L.running?'':' off'}"></span><span class="clockbox"><span class="clock" id="clock">${L.phase==='pre'?'00:00':fmtClock(liveClockMs(p))}</span><span class="phase">${PHASE[L.phase]}</span></span>${ctl}</div>
 <div class="scoreboard">${left[0]}${left[1]}<span class="sb-sep">:</span>${left[2]}${left[3]}</div>
 <div class="lb-right">${L.phase!=='FT'&&L.phase!=='pre'?`<button class="btn sm dark" data-a="endMatch">Finalizar partido</button>`:''}<button class="btn sm ghost restart" data-a="restartMatch" title="Poner todo a cero">${IC.undo} Reiniciar partido</button></div></div>`}
V.live=()=>{const p=plan(R.id);if(!p)return V.home();const L=liveState(p),tab=R.tab||'jug',c=comp(p.compId)||{changes:5,windows:5};

   ${Object.entries(groups).map(([k,arr])=>`<div class="grp">${esc(action(k)?.name||'Sin acción')}</div>${arr.map(x=>`<button class="lp${sel&&x.id===sel.id?' on':''}" data-a="livePlay" data-id="${x.id}"><span class="no">${list.indexOf(x)+1}</span><span class="t">${esc(x.name)}</span><span class="cnt">${cnt(x.id)?'×'+cnt(x.id):''}</span></button>`).join('')}`).join('')||'<div class="empty">No hay jugadas '+(f==='of'?'ofensivas':'defensivas')+' en este plan.</div>'}

    <div class="stage"><div class="boardwrap" id="liveBoard"></div></div>`:'<div class="empty">Selecciona una jugada.</div>'}</div>
   <div class="resultscol">${sel?`${L.log.length?`<button class="undo" data-a="logUndo" title="Deshacer el último registro">${IC.undo}<span>Deshacer<br><small>${esc(L.log[L.log.length-1].min+"' "+L.log[L.log.length-1].result)}</small></span></button>`:''}<span class="lbl">REGISTRAR<br>MIN ${liveMinute(p)}</span>${(sel.side==='def'?RES_DEF:RES_OF).map(([r,cl])=>`<button class="${cl||''}" data-a="logRes" data-r="${esc(r)}">${esc(r)}</button>`).join('')}`:''}</div></div>`}
 else if(tab==='cam'){const field=onField(p),bench=[...p.starters,...p.subs].filter(id=>!field.includes(id)&&!L.subs.some(s=>s.out===id));
  const windows=new Set(L.subs.map(s=>s.win)).size;const focus=R.focus||(L.subs.length?L.subs[L.subs.length-1].in:null);R.focus=focus;
  body=`<div class="pad"><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><span class="pill" style="box-shadow:var(--shadow)">CAMBIOS ${L.subs.length}/${c.changes}</span><span class="pill" style="box-shadow:var(--shadow)">VENTANAS ${windows}/${c.windows}</span><span style="flex:1"></span><button class="btn" data-a="subNew"${L.subs.length>=c.changes?' disabled':''}>Hacer cambio</button></div>
   ${L.subs.length?`<div class="list">${L.subs.map(s=>{const o=playerById(s.out),i=playerById(s.in);return `<div class="subrow"><b class="arrow">MIN ${s.min}</b><span class="arrow inn">▲ ${esc(pnum(i))} ${esc(pname(i))}</span><span class="arrow out">▼ ${esc(pnum(o))} ${esc(pname(o))}</span><span style="flex:1"></span><button class="btn sm" data-a="focus" data-id="${s.in}">Ver sus jugadas</button><button class="btn sm dark" data-a="subDel" data-id="${s.id}" aria-label="Deshacer cambio">${IC.close}</button></div>`}).join('')}</div>`:''}
   <div class="field"><span>Ver las jugadas de un jugador</span><select class="inp" data-f="focus"><option value="">— Elige jugador —</option><optgroup label="En el campo">${field.map(id=>{const x=playerById(id);return x?`<option value="${id}"${id===focus?' selected':''}>${esc(pnum(x))} · ${esc(pname(x))}</option>`:''}).join('')}</optgroup><optgroup label="Banquillo">${bench.map(id=>{const x=playerById(id);return x?`<option value="${id}"${id===focus?' selected':''}>${esc(pnum(x))} · ${esc(pname(x))}</option>`:''}).join('')}</optgroup></select></div>
   ${focus?briefing(p,focus):''}</div>`}
 else if(tab==='reg'){body=`<div class="pad"><div class="actions" style="justify-content:space-between"><b style="font-family:var(--display);font-size:22px">${L.log.length} acciones registradas</b><button class="btn ghost sm" data-a="logRival">Registrar acción sin jugada</button></div><div class="tablewrap"><table class="stat"><thead><tr><th>Min</th><th>Sentido</th><th>Acción</th><th>Jugada</th><th>Resultado</th><th>Zona</th><th>Remata</th><th></th></tr></thead><tbody>${[...L.log].reverse().map(l=>{const pl=p.plays.find(x=>x.id===l.playId);const sh=l.shooter?playerById(l.shooter):null;return `<tr><td>${l.min}'</td><td>${l.side==='def'?'Def.':'Of.'}</td><td>${esc(action(l.actionId)?.name||'—')}</td><td>${esc(pl?.name||'Sin jugada')}</td><td><b>${esc(l.result)}</b></td><td>${esc(l.zone||'—')}</td><td>${sh?esc(pnum(sh)+' '+pname(sh)):(l.shooter==='rival'?'Rival':'—')}</td><td class="num"><button class="btn sm dark" data-a="logDel" data-id="${l.id}" aria-label="Borrar registro">${IC.close}</button></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Aún no hay acciones. Regístralas desde JUGADAS.</td></tr>'}</tbody></table></div></div>`}

function briefSel(pid){if(R.bselFor!==pid){R.bselFor=pid;R.bsel=[]}return R.bsel}
function briefing(p,pid){const x=playerById(pid);const plays=playerPlays(p,pid);const res=resolver(p);const sel=briefSel(pid);
 const replaced=(p.live?.subs||[]).find(s=>s.in===pid);const orig=replaced?playerById(replaced.out):null;
 return `<section class="card"><h3>Jugadas de ${esc(pnum(x))} ${esc(pname(x))}${orig?` · ocupa el sitio de ${esc(pnum(orig))} ${esc(pname(orig))}`:''} · ${plays.length}</h3><div class="in">${plays.length?`

function statsHTML(p){const L=liveState(p);const of=L.log.filter(l=>l.side!=='def'),df=L.log.filter(l=>l.side==='def');
 const shots=of.filter(l=>SHOTS.includes(l.result)).length,goals=of.filter(l=>l.result==='Gol').length,conc=df.filter(l=>l.result==='Gol en contra').length,rivShots=df.filter(l=>['Gol en contra','Remate rival'].includes(l.result)).length;
 const byAct={};of.forEach(l=>{const k=l.actionId||'_';byAct[k]=byAct[k]||{n:0,s:0,g:0};byAct[k].n++;if(SHOTS.includes(l.result))byAct[k].s++;if(l.result==='Gol')byAct[k].g++});
 const byPlay={};of.filter(l=>l.playId).forEach(l=>{byPlay[l.playId]=byPlay[l.playId]||{n:0,s:0,g:0};byPlay[l.playId].n++;if(SHOTS.includes(l.result))byPlay[l.playId].s++;if(l.result==='Gol')byPlay[l.playId].g++});
 const max=Math.max(1,...Object.values(byAct).map(v=>v.n));
 return `<div class="kpis">${[[of.length,'ABP ofensivos'],[shots,'Remates'],[goals,'Goles a favor'],[of.length?Math.round(shots/of.length*100)+'%':'—','% acaban en remate'],[df.length,'ABP defensivos'],[rivShots,'Remates rivales'],[conc,'Goles en contra']].map(([n,l])=>`<div class="kpi"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
 <h3 style="margin:8px 0 0;font-family:var(--display);font-size:22px">Por acción (ofensivo)</h3><div class="tablewrap"><table class="stat"><thead><tr><th>Acción</th><th class="num">Ejecuciones</th><th></th><th class="num">Remates</th><th class="num">Goles</th></tr></thead><tbody>${Object.entries(byAct).map(([k,v])=>`<tr><td>${esc(action(k)?.name||'Sin acción')}</td><td class="num">${v.n}</td><td><div class="bar"><i style="width:${v.n/max*100}%"></i></div></td><td class="num">${v.s}</td><td class="num">${v.g}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sin datos todavía.</td></tr>'}</tbody></table></div>
 <h3 style="margin:8px 0 0;font-family:var(--display);font-size:22px">Por jugada</h3><div class="tablewrap"><table class="stat"><thead><tr><th>Jugada</th><th class="num">Ejecuciones</th><th class="num">Remates</th><th class="num">Goles</th></tr></thead><tbody>${Object.entries(byPlay).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>`<tr><td>${esc(p.plays.find(x=>x.id===k)?.name||'—')}</td><td class="num">${v.n}</td><td class="num">${v.s}</td><td class="num">${v.g}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Sin datos todavía.</td></tr>'}</tbody></table></div>${zoneStats(of)}`}

/* drag-to-reorder for lists: listeners live on document so moving the row never loses the pointer */
function initSort(list){const kind=list.dataset.sort;list.querySelectorAll('.handle').forEach(h=>{h.addEventListener('pointerdown',e=>{e.preventDefault();const row=h.closest('.row');row.classList.add('dragging');const sc=list.closest('main');let lastY=e.clientY,raf=0;

 const upf=()=>{cancelAnimationFrame(raf);row.classList.remove('dragging');document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',upf);document.removeEventListener('pointercancel',upf);
  const ids=[...list.querySelectorAll(':scope>.row')].map(r=>r.dataset.id);const ord=x=>{const i=ids.indexOf(x.id);return i<0?9999:i};
  if(kind==='plays'){const pl=plan(R.id);const vis=pl.plays.filter(x=>ids.includes(x.id)).sort((a,b)=>ord(a)-ord(b));let k=0;pl.plays=pl.plays.map(x=>ids.includes(x.id)?vis[k++]:x)}

 const pad=Math.min(vw,vh)*.1,X0=vx+pad,X1=vx+vw-pad,Y0=vy+pad,Y1=vy+vh-pad;

  Object.entries(groups).forEach(([k,arr])=>{arr.forEach((id,i)=>{const f=(i+1)/(arr.length+1);let X,Y;if(rot){X=X0+(X1-X0)*T[k];Y=Y0+(Y1-Y0)*f}else{Y=Y1-(Y1-Y0)*T[k];X=X0+(X1-X0)*f}pts.push([id,toW(X,Y)])})})}
 else{const cols=Math.min(ids.length,ids.length>10?8:5),rows=Math.ceil(ids.length/cols);const gx=Math.min(6,(X1-X0)/cols),gy=Math.min(6.5,(Y1-Y0)/Math.max(rows,1));const cx=vx+vw/2,cy=vy+vh/2;

function viewerList(p,b){const hl=b&&b.dataset.hl;if(b&&b.dataset.sel){const pp=playerPlays(p,hl);return (R.bsel||[]).map(id=>pp.find(x=>x.id===id)).filter(Boolean)}if(hl)return playerPlays(p,hl);const f=R.f||'of';const L=liveOrdered(p,f).list;return L.length?L:p.plays}
ACT.openViewer=b=>{const p=plan(R.id);const list=viewerList(p,b);const i=Math.max(0,list.findIndex(x=>x.id===b.dataset.id));if(!list.length)return;VIEW={pid:p.id,list:list.map(x=>x.id),idx:i,hl:b.dataset.hl||null,hls:b.dataset.hl?[b.dataset.hl]:[]};
 try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen){VIEW.fs=true;document.documentElement.requestFullscreen().catch(()=>{VIEW&&(VIEW.fs=false)})}}catch(e){}drawViewer()};
function drawViewer(){if(!VIEW)return;const p=plan(VIEW.pid);const pl=p.plays.find(x=>x.id===VIEW.list[VIEW.idx]);if(!pl){ACT.closeViewer();return}
 if(VIEWB)VIEWB.playing=false;$('#viewer')?.remove();const o=document.createElement('div');o.className='overlay';o.id='viewer';
 if(VIEW.clean){const res=resolver(p);const roles=VIEW.hls.map(id=>{const t=pl.tokens.find(t=>t.pid&&res(t.pid)===id),x=playerById(id);return x?{x,note:t&&t.note}:null}).filter(Boolean);
  o.classList.add('teach');o.innerHTML=`<div class="stage vstage" style="flex:1"><button class="vnav l" data-a="vNav" data-d="-1" aria-label="Jugada anterior">${IC.chevL}</button><div class="boardwrap" id="viewBoard"></div><button class="vnav r" data-a="vNav" data-d="1" aria-label="Jugada siguiente">${IC.chevR}</button>
   <div class="teach-tools"><button class="ctrl" data-a="vPlay" title="Reproducir">${IC.play}</button><button class="ctrl" data-a="vTeach" title="Salir del modo jugador">${IC.close}</button></div></div>
   <div class="teach-bar"><div class="tplay"><span class="tcount">${VIEW.idx+1}/${VIEW.list.length}</span><span class="tname">${esc(pl.name)}</span></div>${roles.length?`<div class="troles">${roles.map(r=>`<span class="trole"><b>${esc(pnum(r.x))}</b><span>${esc(pname(r.x))}</span>${r.note?`<em>${esc(r.note)}</em>`:''}</span>`).join('')}</div>`:''}${pl.signal?`<div class="tsig">${IC.signal} Señal: ${esc(pl.signal)}</div>`:''}</div>`;
  document.body.appendChild(o);VIEWB=new Board($('#viewBoard'),pl,{mode:'view',fitWidth:fitWide(),names:true,hl:null,hlSet:new Set(VIEW.hls),resolve:res,teamObj:team(p.teamId),opp:p.opp});attachSwipe($('#viewer .vstage'),d=>ACT.vNav({dataset:{d:String(d)}}));swAnim($('#viewer .vstage'));return}const hp=VIEW.hl?playerById(VIEW.hl):null;
 const tk=VIEW.hl?pl.tokens.find(t=>t.pid&&resolver(p)(t.pid)===VIEW.hl):null;
 o.innerHTML=`<header class="top" style="grid-template-columns:56px 1fr 150px"><button class="iconbtn" data-a="closeViewer" aria-label="Cerrar">${IC.back}</button><div class="ttl"><h1>${VIEW.idx+1}/${VIEW.list.length} · ${esc(pl.name)}</h1></div><span class="muted" style="font-size:13px;text-align:right">Desliza o ← → para pasar<br>Esc para salir</span></header>${subStrip(p)}
 <div class="vinfo">${hlChips(p)}${tk&&tk.note?`<span class="role">Su función: ${esc(tk.note)}</span>`:''}${pl.signal?`<span><b>Señal:</b> ${esc(pl.signal)}</span>`:''}${pl.notes?`<span class="muted">${esc(pl.notes)}</span>`:''}<span class="muted">${esc(action(pl.actionId)?.name||'')} · ${pl.side==='def'?'Defensiva':'Ofensiva'}</span></div>
 <div class="stage vstage" style="flex:1"><button class="vnav l" data-a="vNav" data-d="-1" aria-label="Jugada anterior">${IC.chevL}</button><div class="boardwrap" id="viewBoard"></div><button class="vnav r" data-a="vNav" data-d="1" aria-label="Jugada siguiente">${IC.chevR}</button></div>
 <div class="animbar"><div class="ctrls"><button class="ctrl" data-a="vPlay" title="Reproducir">${IC.play}</button><button class="ctrl" data-a="vStop" title="Parar">${IC.stop}</button><span class="sep"></span><button class="ctrl${fitWide()?' on':''}" data-a="toggleFit" title="Ampliar a lo ancho / campo completo">${IC.fitW}</button><button class="ctrl" data-a="bigSignal" data-id="${pl.id}" title="Señal en grande">${IC.signal}</button><button class="ctrl" data-a="vTeach" title="Modo jugador: pantalla limpia">${IC.teach}</button><button class="ctrl" data-a="vEdit" title="Editar jugada">${IC.edit}</button></div></div>`;
 document.body.appendChild(o);VIEWB=new Board($('#viewBoard'),pl,{mode:'view',fitWidth:fitWide(),names:true,hl:null,hlSet:new Set(VIEW.hls),resolve:resolver(p),teamObj:team(p.teamId),opp:p.opp});attachSwipe($('#viewer .vstage'),d=>ACT.vNav({dataset:{d:String(d)}}));swAnim($('#viewer .vstage'))}
function hlChips(p){const ids=[...new Set([...(VIEW.hl?[VIEW.hl]:[]),...(p.live?.subs||[]).map(s=>s.in),...VIEW.hls])];if(!ids.length)return '';
 return `<span class="hlbar"><span class="muted" style="font-size:13px">RESALTAR:</span>${ids.map(id=>{const x=playerById(id);return x?`<button class="hlchip${VIEW.hls.includes(id)?' on':''}" data-a="vHl" data-id="${id}">${esc(pnum(x))} ${esc(pname(x))}</button>`:''}).join('')}</span>`}
ACT.vHl=b=>{if(!VIEW)return;const i=VIEW.hls.indexOf(b.dataset.id);if(i>=0)VIEW.hls.splice(i,1);else VIEW.hls.push(b.dataset.id);drawViewer()};
ACT.vNav=b=>{if(!VIEW)return;const n=VIEW.list.length;VIEW.idx=(VIEW.idx+ +b.dataset.d+n)%n;drawViewer()};
ACT.vPlay=()=>VIEWB&&!VIEWB.playing&&VIEWB.playAnim();
ACT.vStop=()=>VIEWB&&VIEWB.stop();
ACT.closeViewer=()=>{const fs=VIEW&&VIEW.fs;if(VIEWB)VIEWB.playing=false;VIEWB=null;VIEW=null;$('#viewer')?.remove();try{if(fs&&document.fullscreenElement)document.exitFullscreen()}catch(e){}};
ACT.vEdit=()=>{if(!VIEW)return;const id=VIEW.list[VIEW.idx];ACT.closeViewer();editFromLive(id)};
ACT.liveEdit=b=>editFromLive(b.dataset.id);
function editFromLive(id){const p=plan(R.id);const pl=p.plays.find(x=>x.id===id);if(!pl)return;if(R.tab==='jug'||!R.tab){R.play=id;R.f=pl.side}go({v:'play',ctx:'plan',pid:p.id,id,tab:'pizarra',live:p.id})}
ACT.saveBack=()=>{save();toast('Jugada guardada');back()};
ACT.briefToggle=b=>{const s=R.bsel||(R.bsel=[]);const i=s.indexOf(b.dataset.id);if(i>=0)s.splice(i,1);else s.push(b.dataset.id);refreshBrief()};
ACT.briefAll=()=>{const p=plan(R.id),pp=playerPlays(p,R.focus);R.bsel=(R.bsel||[]).length===pp.length?[]:pp.map(x=>x.id);refreshBrief()};
ACT.briefGo=()=>{const s=R.bsel||[];if(!s.length){toast('Toca primero las jugadas que quieres ver');return}ACT.openViewer({dataset:{id:s[0],hl:R.focus,sel:'1'}})};
function fitWide(){return DB.profile.fitWide!==false}
ACT.toggleFit=()=>{DB.profile.fitWide=!fitWide();save();if(VIEW)drawViewer();if(R.v==='live')render();toast(fitWide()?'Pizarra ampliada a lo ancho':'Campo completo')};
ACT.liveNav=b=>{const p=plan(R.id);const list=liveOrdered(p,R.f||'of').list;if(!list.length)return;let i=list.findIndex(x=>x.id===R.play);i=(i+ +b.dataset.d+list.length)%list.length;reroute({play:list[i].id})};
ACT.toggleList=()=>reroute({hideList:!R.hideList});
ACT.subChip=b=>{ACT.closeViewer();reroute({tab:'cam',focus:b.dataset.id})};
ACT.clockStart=()=>{const L=liveState(plan(R.id));if(L.phase==='pre'){L.phase='1T';L.half=1}else if(L.phase==='HT'){L.phase='2T';L.half=2}L.elapsed=0;L.startedAt=Date.now();L.running=true;save();render()};
ACT.endHalf=()=>{const p=plan(R.id),L=liveState(p);if(L.running){L.elapsed+=Date.now()-L.startedAt;L.running=false}if(L.phase==='1T'){L.phase='HT';toast('Fin de la 1ª parte')}else{L.phase='FT';toast('Fin del partido')}save();render()};
ACT.endMatch=()=>confirmBox('¿Finalizar el partido? El reloj se para. Podrás reabrirlo si te equivocas.',()=>{const L=liveState(plan(R.id));if(L.running){L.elapsed+=Date.now()-L.startedAt;L.running=false}L.phase='FT';save();R.tab='est';render();toast('Partido finalizado')},'Finalizar');
ACT.restartMatch=()=>confirmBox('¿Empezar el partido desde cero? Se borran el reloj, el marcador, los cambios y todo el registro de este partido. Las jugadas no se tocan.',()=>{const p=plan(R.id);p.live=null;liveState(p);R.focus=null;R.bsel=[];R.bselFor=null;R.tab='jug';save();render();toast('Partido reiniciado: todo a cero')},'Reiniciar');
ACT.reopen=()=>{const L=liveState(plan(R.id));L.phase=L.half===2?'2T':'1T';save();render()};

/* ============ global events ============ */
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a||a.disabled)return;const f=ACT[a.dataset.a];if(f){e.preventDefault();f(a,e)}});
function onField_(e){const el=e.target;const f=el.dataset&&el.dataset.f;if(!f)return;const v=el.value;
 if(f==='planQ'){R.q=v;const pos=el.selectionStart;render();const n=$('#planQ');n.focus();n.setSelectionRange(pos,pos);return}
 if(f.startsWith('plan.')){const p=plan(R.id);if(f==='plan.opp.name')p.opp.name=v;else if(f==='plan.opp.color')p.opp.color=v;else if(f==='plan.opp.gk')p.opp.gk=v;else p[f.slice(5)]=v;save();if(e.type==='change'&&['plan.teamId','plan.compId'].includes(f))render();if(f==='plan.opp.name'){const m=$('.matchup');if(m){const t=document.createElement('div');t.innerHTML=matchup(p);m.replaceWith(t.firstChild)}}return}
 if(f==='mark'){plan(R.id).marks[el.dataset.id]=v;save();return}
 if(f.startsWith('task.')){const pl=playCtx().play;pl.task=pl.task||{};pl.task[f.slice(5)]=v;save();return}
 if(f.startsWith('kit.')){const k=boardKit(playCtx().play);const [,sd,key]=f.split('.');k[sd][key]=v;kitApply();return}
 if(f==='boardQ'){R.q=v;const pos=el.selectionStart;render();const n=$('#boardQ');if(n){n.focus();n.setSelectionRange(pos,pos)}return}
 if(f.startsWith('play.')){const pl=playCtx().play;if(f==='play.param')pl.params[el.dataset.id]=v;else pl[f.slice(5)]=f==='play.name'?v.toUpperCase():v;save();if(e.type==='change'&&f==='play.actionId')render();return}
 if(f.startsWith('tok.')&&BOARD){const o=BOARD.find(BOARD.sel);if(!o)return;const k=f.slice(4);
  if(['type','pid','showName'].includes(k)&&e.type!=='change')return;
  if(k==='pid'){BOARD.snap();BOARD.p.tokens.forEach(t=>{if(v&&t.pid===v&&t!==o)t.pid=null});o.pid=v||null}
  else if(k==='type'){BOARD.snap();o.type=v}
  else if(k==='showName'){o.st=o.st||{};o.st.name=el.checked}
  else if(k==='c1'||k==='c2'||k==='nameText'){o.st=o.st||{};o.st[k]=v;if(k!=='nameText')rememberSt(o)}
  else o[k]=v;
  BOARD.draw();save();if(['pid','type','showName'].includes(k)){renderInsp(o);refreshSide()}return}
 if(f==='prof.name'||f==='prof.role'){DB.profile[f.slice(5)]=v;save();return}
 if(f==='focus'&&e.type==='change'){reroute({focus:v||null});return}
 if(f==='speed'&&BOARD){BOARD.speed=+v}}
document.addEventListener('input',onField_);
document.addEventListener('change',onField_);
document.addEventListener('keydown',e=>{const inInp=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
 if(BOARD&&!inInp&&!$('#scrim')&&(e.key==='Delete'||e.key==='Backspace')&&(BOARD.sel||(BOARD.msel&&BOARD.msel.size))){e.preventDefault();BOARD.delSel();return}
 if(e.key==='Escape'&&BOARD&&!$('#scrim')&&!inInp){if(BOARD.msel&&BOARD.msel.size){BOARD.select(null);return}if(BOARD.tool!=='move'||BOARD.placePid){ACT.toolMove();return}}
 if(e.key==='Escape'){if($('#sigov')){ACT.closeSignal();return}if(VIEW&&VIEW.clean){ACT.vTeach();return}if($('#viewer'))ACT.closeViewer();else closeModal()}
 if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&!$('#scrim')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')){const d=e.key==='ArrowRight'?1:-1,fake={dataset:{d:String(d)}};
  if(VIEW){e.preventDefault();ACT.vNav(fake);return}
  if(R.v==='live'&&(R.tab||'jug')==='jug'){e.preventDefault();ACT.liveNav(fake);return}
  if(R.v==='live'&&R.tab==='cam'&&R.focus&&(R.bsel||[]).length&&R.bselFor===R.focus){e.preventDefault();ACT.briefGo();return}
  if(R.v==='live'&&R.tab==='cam'&&R.focus){const p=plan(R.id),L=playerPlays(p,R.focus);if(L.length){e.preventDefault();ACT.openViewer({dataset:{id:(d>0?L[0]:L[L.length-1]).id,hl:R.focus}})}return}}
 if(BOARD&&R.v==='play'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')){if((e.key==='Delete'||e.key==='Backspace')&&BOARD.sel){e.preventDefault();BOARD.delSel()}if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();BOARD.undoIt()}}});

document.addEventListener('fullscreenchange',()=>{if(VIEW&&VIEW.fs&&!document.fullscreenElement){VIEW.fs=false;ACT.closeViewer()}});
/* ============ boot ============ */
DB=migrate(load()||seed());
applyTheme();save();render();

/* offline app (tablet): only when served with its manifest */
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&document.querySelector('link[rel="manifest"]'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}catch(e){}
</script>
